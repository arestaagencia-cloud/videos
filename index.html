<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Vídeos do Baile | ArestAgência</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<script>
  // As galerias dos bailes agora ficam em entregas.arestagencia.com.br/bailes/<baile>/.
  // Este endereço antigo só redireciona, mantendo ?pedido= e ?baixar= (links já enviados continuam valendo).
  var GALERIAS = { "da-lhe-samba": "idalhesamba" };
  var q = new URLSearchParams(location.search);
  var pasta = GALERIAS[q.get("evento") || "da-lhe-samba"] || "idalhesamba";
  location.replace("https://entregas.arestagencia.com.br/bailes/" + pasta + "/" + location.search);
</script>
<meta http-equiv="refresh" content="0; url=https://entregas.arestagencia.com.br/bailes/idalhesamba/">
</head>
<body style="background:#040404;color:#F8F4F2;font-family:Helvetica,Arial,sans-serif;text-align:center;padding:80px 20px">
  <p>Abrindo a galeria… <a style="color:#F6AD03" href="https://entregas.arestagencia.com.br/bailes/idalhesamba/">clique aqui</a> se não abrir.</p>
</body>
</html>
